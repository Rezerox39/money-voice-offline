name: Build Standalone Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Prebuild Native Android Project
        run: npx expo prebuild --platform android --clean

      - name: Sign release with debug key
        run: |
          # Configure release to use debug signing config
          cd android
          sed -i 's/signingConfig signingConfigs.debug/signingConfig signingConfigs.debug/' app/build.gradle
          # Ensure release build type uses debug signing and no minification
          sed -i '/release {/,/}/ {
            s/minifyEnabled.*/minifyEnabled false/
            s/shrinkResources.*/shrinkResources false/
          }' app/build.gradle

      - name: Build Release APK (with embedded JS bundle)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Verify JS Bundle is Embedded
        run: |
          echo "Checking for index.android.bundle in release APK..."
          unzip -l android/app/build/outputs/apk/release/app-release.apk | grep "assets/index.android.bundle" || {
            echo "WARNING: Bundle not found, trying Hermes bytecode..."
            unzip -l android/app/build/outputs/apk/release/app-release.apk | grep "assets/" | head -10
          }

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: money-voice-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 5
